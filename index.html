<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Library</title>
    <script type="module" src="index.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Odin Library</h1>
        <dialog class="book-info">
            <div class="row">
                <label for="title">Book Title: </label>
                <input type="text" id="title" name="title" placeholder="The Hobbit" required>
            </div>
            <div class="row">
                <label for="author">Book Author: </label>
                <input type="text" id="author" name="author" placeholder="J.R.R. Tolkien" required>
            </div>
            <div class="row">
                <label for="pages">Book Pages: </label>
                <input type="number" id="pages" required>
            </div>
            <div class="row">
                <label for="read">Read</label>
                <input type="checkbox" id="read" name="read" required>
            </div>
            <button type="button" class="add-book-btn">Add Book</button>
        </dialog>
        <div class="btn">
            <button class="new-book-btn">New Book</button>
        </div>
        <div class="library-container"></div>
    </div>
</body>

</html>
